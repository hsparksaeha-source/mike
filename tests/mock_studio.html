<!doctype html>
<!-- 테스트용: YouTube 스튜디오 '언어' 화면을 흉내 낸 가짜 페이지 (실제 스튜디오 아님) -->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Mock Studio Translations</title>
<style>
  body { font-family: sans-serif; }
  .row { display: flex; gap: 40px; padding: 12px; border-bottom: 1px solid #ddd; }
  .row > div { width: 160px; }
  .lang { cursor: pointer; }
  #dialog { position: fixed; inset: 40px; background: #fff; border: 1px solid #333; padding: 20px; }
  .item { display: flex; justify-content: space-between; width: 400px; padding: 8px 0; }
  #menu { display: none; position: absolute; background: #fff; border: 1px solid #333; }
  .field { border: 1px solid #999; min-height: 24px; width: 380px; padding: 4px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>언어</h1>
<button id="add-lang">언어 추가</button>
<!-- '언어 추가' 목록: 평소에는 숨겨져 있고, 여기 있는 이름은 표의 언어로 세면 안 됨 -->
<div id="menu" role="listbox">
  <div role="option">힌디어</div><div role="option">태국어</div><div role="option">일본어</div>
</div>
<div id="table"></div>

<div id="dialog" role="dialog" hidden>
  <div style="display:flex; justify-content:space-between">
    <h2 id="dlg-title"></h2>
    <div>
      <button id="save" disabled>업데이트</button>
      <button id="close" aria-label="닫기">X</button>
    </div>
  </div>
  <div><span>제목</span></div>
  <div id="title-field" class="field" contenteditable="true"></div>
  <div><span>설명</span></div>
  <div id="desc-field" class="field" contenteditable="true" style="min-height:60px"></div>
  <div class="item"><span>썸네일</span><button id="thumb-btn">추가</button></div>
  <div class="item"><span>오디오</span><button id="audio-btn">추가</button></div>
  <div class="item"><span>수동 자막</span><button>추가</button></div>
  <input type="file" id="file" accept="image/*" style="display:none">
  <input type="file" id="audio-file" accept="audio/*" style="display:none">
  <div id="audio-dialog" hidden><h3>오디오 트랙 추가</h3></div>
</div>

<script>
  const langs = [
    ["구자라트어", false], ["그리스어", false], ["네덜란드어", true],
    ["네팔어", false], ["중국어(간체)", false], ["아랍어", false],
  ];
  const state = Object.fromEntries(langs.map(([n, has]) => [n, has]));
  // 기존 언어는 제목·설명이 이미 들어가 있음
  const texts = Object.fromEntries(langs.map(([n]) => [n, {title: n + " 기존 제목", desc: "기존 설명"}]));
  window.uploaded = {};
  window.saved = {};
  let current = null;

  // 실제 스튜디오에서 생길 수 있는 상황 흉내: ?overlay=1 (이름 위를 투명한 요소가 덮음), ?norole=1 (창에 role=dialog 없음)
  const params = new URLSearchParams(location.search);
  if (params.get("norole")) document.getElementById("dialog").removeAttribute("role");
  function render() {
    const t = document.getElementById("table");
    t.innerHTML = '<div class="row"><div>언어</div><div>제목 및 설명</div><div>썸네일</div></div>';
    for (const [name] of langs) {
      const r = document.createElement("div");
      r.className = "row";
      r.innerHTML = `<div class="lang">${name}</div><div>게시됨</div><div>${state[name] ? "게시됨" : "–"}</div>`;
      r.querySelector(".lang").onclick = () => openDialog(name);
      if (params.get("overlay")) {
        r.style.position = "relative";
        const cover = document.createElement("div");
        cover.style.cssText = "position:absolute; inset:0; background:transparent";
        r.appendChild(cover);
      }
      t.appendChild(r);
    }
  }
  function openDialog(name) {
    current = name;
    document.getElementById("dlg-title").textContent = name;
    document.getElementById("thumb-btn").textContent = state[name] ? "변경" : "추가";
    document.getElementById("title-field").textContent = texts[name].title;
    document.getElementById("desc-field").textContent = texts[name].desc;
    document.getElementById("save").disabled = true;
    document.getElementById("dialog").hidden = false;
  }
  // ?custombtn=1: 실제 스튜디오처럼 썸네일 '추가'가 <button> 이 아닌 사용자 정의 요소인 경우
  if (params.get("custombtn")) {
    const old = document.getElementById("thumb-btn");
    const custom = document.createElement("ytcp-button");
    custom.id = "thumb-btn";
    custom.innerHTML = "<div>추가</div>";
    old.replaceWith(custom);
  }
  document.getElementById("thumb-btn").onclick = () => document.getElementById("file").click();
  window.audioOpened = false;
  document.getElementById("audio-btn").onclick = () => {
    window.audioOpened = true;
    document.getElementById("audio-dialog").hidden = false;
    document.getElementById("audio-file").click();
  };
  document.getElementById("file").onchange = (e) => {
    const f = e.target.files[0];
    window.uploaded[current] = f.name;
    // 업로드 처리 시간 흉내
    setTimeout(() => { document.getElementById("save").disabled = false; }, 400);
  };
  for (const id of ["title-field", "desc-field"]) {
    document.getElementById(id).addEventListener("input", () => { document.getElementById("save").disabled = false; });
  }
  // '언어 추가' -> 목록에서 언어 선택 -> 표에 새 줄 (제목·설명 비어 있음)
  document.getElementById("add-lang").onclick = () => { document.getElementById("menu").style.display = "block"; };
  for (const opt of document.querySelectorAll("#menu [role=option]")) {
    opt.onclick = () => {
      const name = opt.textContent;
      document.getElementById("menu").style.display = "none";
      if (!(name in state)) {
        langs.push([name, false]); state[name] = false; texts[name] = {title: "", desc: ""};
        opt.remove();
        render();
      }
    };
  }
  document.getElementById("save").onclick = () => {
    texts[current] = {title: document.getElementById("title-field").innerText.trim(),
                      desc: document.getElementById("desc-field").innerText.trim()};
    window.saved[current] = {...texts[current], thumb: window.uploaded[current] || null};
    if (window.uploaded[current]) state[current] = true;
    document.getElementById("dialog").hidden = true;
    document.getElementById("file").value = "";
    render();
  };
  document.getElementById("close").onclick = () => { document.getElementById("dialog").hidden = true; };
  render();
</script>
</body>
</html>
